<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap">
</helmet>
<div ref="{{ rootRef }}" style="position:relative;z-index:20;background:#F4EEE4;border-bottom:1px solid rgba(42,33,26,.12);font-family:'Manrope',sans-serif;color:#2A211A">
  <div style="max-width:1280px;margin:0 auto;padding:20px clamp(20px,4.6vw,56px);display:flex;align-items:center;justify-content:space-between;gap:24px">
    <a href="index.html" style="display:flex;flex-direction:column;gap:4px;color:#2A211A;text-decoration:none">
      <span style="font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;line-height:1">Eucalyptus</span>
      <span style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#6B4A30;font-weight:600">nameštaj po meri · od 2000.</span>
    </a>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:34px;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="4"><a href="{{ l.href }}" style="color:#2A211A;text-decoration:none;padding:6px 0;background-image:linear-gradient(#2A211A,#2A211A);background-repeat:no-repeat;background-position:left bottom;background-size:{{ l.bs }};transition:background-size .35s ease" style-hover="background-size:100% 2px">{{ l.label }}</a></sc-for>
        <a href="{{ bookHref }}" style="background:#2A211A;color:#F4EEE4;padding:14px 22px;border-radius:2px;font-size:11.5px;letter-spacing:.16em;text-decoration:none">Zakaži procenu</a>
      </nav>
    </sc-if>
    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggle }}" style="display:flex;align-items:center;gap:10px;background:transparent;border:1px solid #2A211A;color:#2A211A;border-radius:2px;padding:12px 18px;font:500 15px 'Manrope',sans-serif;cursor:pointer;min-height:44px">
        <span style="display:flex;flex-direction:column;gap:4px"><span style="width:16px;height:1.5px;background:#2A211A"></span><span style="width:16px;height:1.5px;background:#2A211A"></span></span>{{ menuLabel }}
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ menuShown }}" hint-placeholder-val="{{ false }}">
    <nav style="position:absolute;left:0;right:0;top:100%;background:#F4EEE4;border-bottom:1px solid rgba(42,33,26,.15);box-shadow:0 18px 30px rgba(42,33,26,.12);padding:4px 20px 24px;display:flex;flex-direction:column">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="4"><a href="{{ l.href }}" style="padding:16px 0;border-bottom:1px solid rgba(42,33,26,.1);font-family:'Cormorant Garamond',serif;font-size:30px;color:#2A211A;text-decoration:none">{{ l.label }}</a></sc-for>
      <a href="{{ bookHref }}" style="margin-top:20px;background:#2A211A;color:#F4EEE4;padding:16px;border-radius:2px;text-align:center;font-weight:500;text-decoration:none">Zakaži procenu</a>
    </nav>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;kuhinje&quot;,&quot;namestaj&quot;,&quot;galerija&quot;,&quot;onama&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const LINKS = [
  { key: 'kuhinje', label: 'Kuhinje', href: 'kuhinje.html' },
  { key: 'namestaj', label: 'Nameštaj', href: 'namestaj.html' },
  { key: 'galerija', label: 'Galerija', href: 'galerija.html' },
  { key: 'onama', label: 'O nama', href: 'o-nama.html' },
];
class Component extends DCLogic {
  state = { w: 1280, open: false };
  rootRef = el => {
    if (!el || el === this.el) return;
    this.el = el;
    if (this.ro) this.ro.disconnect();
    this.ro = new ResizeObserver(([e]) => { const w = e.contentRect.width; if (w !== this.state.w) this.setState({ w }); });
    this.ro.observe(el);
  };
  componentWillUnmount() { if (this.ro) this.ro.disconnect(); }
  renderVals() {
    const active = this.props.active ?? '';
    const bt = this.props.book ?? (active === 'kuhinje' ? 'Kuhinja' : '');
    const bookHref = 'kontakt.html#zakazivanje' + (bt ? '-' + bt : '');
    const wide = this.state.w >= 960;
    return {
      bookHref,
      rootRef: this.rootRef, wide, narrow: !wide, menuShown: !wide && this.state.open,
      toggle: () => this.setState(s => ({ open: !s.open })),
      menuLabel: this.state.open ? 'Zatvori' : 'Meni',
      links: LINKS.map(l => ({ ...l, bd: l.key === active ? '#2A211A' : 'transparent', bs: l.key === active ? '100% 2px' : '0% 2px' })),
    };
  }
}
</script>
</body>
</html>
